trigger:
  branches:
    include:
      - develop

pool:
  vmImage: 'ubuntu-latest'

stages:

  # ── STAGE 1: Backend Build ──────────────────────────────
  - stage: Build_Backend
    displayName: 'Build .NET Backend'
    jobs:
      - job: Build
        steps:

          - checkout: self
            fetchDepth: 0
            displayName: 'Code download karo'

          - task: UseDotNet@2
            displayName: '.NET 10 install karo'
            inputs:
              version: '10.0.x'

          - task: SonarCloudPrepare@4
            displayName: 'SonarCloud scan prepare karo'
            inputs:
              SonarCloud: 'SonarQube'
              organization: 'heyritikk'
              scannerMode: 'dotnet'
              projectKey: 'heyritikk_full-stack-backend'
              projectName: 'full-stack-backend'

          - script: dotnet restore InternalBudgetTracker.csproj
            workingDirectory: budget-backend
            displayName: 'NuGet packages restore karo'

          - script: dotnet build InternalBudgetTracker.csproj -c Release --no-restore
            workingDirectory: budget-backend
            displayName: 'Backend build karo'

          - task: SonarCloudAnalyze@4
            displayName: 'SonarCloud SAST scan chalao'

          - task: SonarCloudPublish@4
            displayName: 'SonarCloud result publish karo'
            inputs:
              pollingTimeoutSec: '300'

  # ── STAGE 2: Frontend Build ─────────────────────────────
  - stage: Build_Frontend
    displayName: 'Build Angular Frontend'
    dependsOn: Build_Backend
    jobs:
      - job: Build
        steps:

          - checkout: self
            displayName: 'Code download karo'

          - task: NodeTool@0
            displayName: 'Node.js install karo'
            inputs:
              versionSpec: '22.x'

          - script: npm ci
            workingDirectory: budget-frontend
            displayName: 'npm packages install karo'

          - script: npm run build -- --configuration development
            workingDirectory: budget-frontend
            displayName: 'Angular build karo'

  # ── STAGE 3: Trivy — Docker Image Scan ──────────────────
  - stage: Trivy_Scan
    displayName: 'Trivy — Docker Image Scan'
    dependsOn: Build_Frontend
    jobs:
      - job: Scan
        steps:

          - checkout: self
            displayName: 'Code download karo'

          - script: |
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
            displayName: 'Trivy install karo'

          - script: docker build -t budget-backend:scan -f $(Build.SourcesDirectory)/budget-backend/Dockerfile $(Build.SourcesDirectory)/budget-backend
            displayName: 'Backend image banao'

          - script: |
              trivy image \
                --exit-code 1 \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --format table \
                budget-backend:scan
            displayName: 'Backend image scan karo'

          - script: docker build -t budget-frontend:scan -f $(Build.SourcesDirectory)/budget-frontend/Dockerfile $(Build.SourcesDirectory)/budget-frontend
            displayName: 'Frontend image banao'

          - script: |
              trivy image \
                --exit-code 1 \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --format table \
                budget-frontend:scan
            displayName: 'Frontend image scan karo'

  # ── STAGE 4: Checkov — IaC Security Scan ────────────────
  - stage: Checkov_IaC_Scan
    displayName: 'Checkov — Terraform Security Scan'
    dependsOn: Build_Backend
    jobs:
      - job: IaC_Scan
        steps:

          - checkout: self
            displayName: 'Code download karo'

          - script: |
              docker run --rm \
                -v $(Build.SourcesDirectory)/infra:/tf \
                bridgecrew/checkov:latest \
                -d /tf --compact
            displayName: 'Checkov se Terraform scan karo'

  # ── STAGE 5: Push Verified Images to ghcr.io ────────────
  - stage: Push_Image
    displayName: 'Push Images to ghcr.io'
    dependsOn:
      - Trivy_Scan
      - Checkov_IaC_Scan
    condition: succeeded()
    variables:
      - group: secrets
    jobs:
      - job: Push
        steps:

          - checkout: self
            displayName: 'Code download karo'

          - script: |
              echo "$(GHCR_TOKEN)" | docker login ghcr.io -u "$(GHCR_USERNAME)" --password-stdin
            displayName: 'ghcr.io login karo'

          - script: |
              docker build -t ghcr.io/heyritikk/budget-backend:$(Build.BuildId) -t ghcr.io/heyritikk/budget-backend:latest -f $(Build.SourcesDirectory)/budget-backend/Dockerfile $(Build.SourcesDirectory)/budget-backend
              docker push ghcr.io/heyritikk/budget-backend:$(Build.BuildId)
              docker push ghcr.io/heyritikk/budget-backend:latest
            displayName: 'Backend image build & push karo'

          - script: |
              docker build -t ghcr.io/heyritikk/budget-frontend:$(Build.BuildId) -t ghcr.io/heyritikk/budget-frontend:latest -f $(Build.SourcesDirectory)/budget-frontend/Dockerfile $(Build.SourcesDirectory)/budget-frontend
              docker push ghcr.io/heyritikk/budget-frontend:$(Build.BuildId)
              docker push ghcr.io/heyritikk/budget-frontend:latest
            displayName: 'Frontend image build & push karo'