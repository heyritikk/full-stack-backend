services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "14333:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ./budget-backend
    environment:
      ConnectionStrings__DefaultConnection: Server=db;Database=InternalBudgetDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      Security__SecretKey: ${JWT_SECRET_KEY}
    ports:
      - "5078:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./budget-frontend
    ports:
      - "4200:8080"
    depends_on:
      - api

volumes:
  sqldata: