name: CI

on:
  pull_request:
    branches: [develop, sit, uat, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend build and package audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore InternalBudgetTracker.csproj
      - name: Build
        run: dotnet build InternalBudgetTracker.csproj -c Release --no-restore
      - name: Vulnerable packages (SCA gate)
        run: |
          dotnet list InternalBudgetTracker.csproj package --vulnerable --include-transitive | tee sca.txt
          if grep -q "has the following vulnerable packages" sca.txt; then
            echo "Vulnerable packages found, failing the build."
            exit 1
          fi
